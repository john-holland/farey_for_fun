metadata:
  name: "Farey WAN OS"
  version: "0.1.0"
  base_system: "arch_linux"
  chrome_components: true

ldap:
  server: "ldap://ldap.example.com"
  domain: "example.com"
  base_dn: "dc=example,dc=com"
  user_dn: "ou=users,dc=example,dc=com"
  group_dn: "ou=groups,dc=example,dc=com"
  admin_group: "farey-admins"
  user_group: "farey-users"

user_management:
  trust:
    max_trust: 1.0
    min_trust: 0.1
    backoff_factor: 0.5
    recovery_rate: 0.1
  services:
    admin:
      required_trust: 0.8
      backoff_time: 3600  # 1 hour
    system:
      required_trust: 0.8
      backoff_time: 3600
    file_upload:
      required_trust: 0.5
      backoff_time: 300  # 5 minutes
    directory_management:
      required_trust: 0.5
      backoff_time: 300
  ssh:
    key_types: ["rsa", "ed25519"]
    max_keys_per_user: 5
    key_expiry: 365  # days

unleash:
  api_url: "https://unleash.example.com/api"
  api_key: "${UNLEASH_API_KEY}"
  features:
    - name: "new-ui"
      description: "New web interface"
      enabled: true
    - name: "electron-client"
      description: "Electron-based desktop client"
      enabled: true
    - name: "icp-integration"
      description: "Internet Computer Protocol integration"
      enabled: true

rancher:
  api_url: "https://rancher.example.com/v3"
  api_key: "${RANCHER_API_KEY}"
  api_secret: "${RANCHER_API_SECRET}"
  cluster:
    name: "farey-cluster"
    network:
      plugin: "canal"
      options:
        flannel_backend_type: "vxlan"
    services:
      etcd:
        backup_config:
          enabled: true
          interval_hours: 12
          retention: 6

hypervisor:
  type: "containerized"
  workload_management:
    - token: "GNT"
      allocation: "dynamic"
      scaling: "auto"
    - token: "ICP"
      allocation: "dynamic"
      scaling: "auto"
  properties:
    isolation: true
    resource_limits: "dynamic"
    migration: "live"

fareyfs:
  base_path: "./fareyfs_data"
  url_routing:
    enabled: true
    ipv6_compatible: true
    farey_sequence_order: 100
  storage:
    type: "distributed"
    replication: true
    consistency: "eventual"
  search:
    index_type: "farey_tree"
    max_depth: 1000
    cache_size: "1GB"

volume_management:
  type: "distributed"
  storage:
    url_based: true
    ip_based: true
  properties:
    replication: true
    consistency: "eventual"
    encryption: true

caching:
  layers:
    - name: "user_cache"
      type: "distributed"
      properties:
        ttl: "configurable"
        size: "dynamic"
    - name: "fs_cache"
      type: "distributed"
      properties:
        ttl: "configurable"
        size: "dynamic"
  properties:
    invalidation: "eventual"
    persistence: true

network:
  type: "wan"
  protocols:
    - "http/2"
    - "quic"
  properties:
    latency: "optimized"
    bandwidth: "dynamic"
    security: "tls_1.3"

system_requirements:
  minimum:
    cpu: "2 cores"
    memory: "4GB"
    storage: "20GB"
  recommended:
    cpu: "4 cores"
    memory: "8GB"
    storage: "50GB" 